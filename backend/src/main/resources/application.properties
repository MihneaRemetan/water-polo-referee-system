spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/water_polo_referee_system?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.sql.init.data-locations=classpath:teams.sql,classpath:players.sql,classpath:coaches.sql,classpath:data.sql